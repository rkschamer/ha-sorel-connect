appdaemon:
  # might be only needed for local debugging
  # app_dir: apps
  time_zone: Europe/Berlin
  # Horsmar
  latitude: 51.278889
  longitude: 10.406389
  elevation: 290
  plugins:
    HASS:
      type: hass
      # only needed if not used as HA Addon
      ha_url: !secret ha-url
      token: !secret token
    MQTT:
      type: mqtt
      namespace: mqtt
      client_host: !secret mqtt-host
      client_port: 1883
      client_user: !secret mqtt-user
      client_password: !secret mqtt-password
      client_id: appdaemon
http:
  url: http://127.0.0.1:5050
admin: {}
api: {}
hadashboard: {}
